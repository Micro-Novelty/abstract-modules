name: Test Wheels

on:
  push:
    paths:
      - ".github/workflows/test_wheels.yml"
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  TEST_DEPS: "scikit-learn aiohttp psutil pandas cryptography pytest pytest-asyncio"

jobs:
  # ───────────────────────────────────────────────
  # Step 1: Fetch latest release asset URLs
  # ───────────────────────────────────────────────
  get-release:
    name: Fetch Latest Release Metadata
    runs-on: ubuntu-latest
    outputs:
      wheel_urls: ${{ steps.fetch.outputs.wheel_urls }}
      sdist_urls: ${{ steps.fetch.outputs.sdist_urls }}
      tag: ${{ steps.fetch.outputs.tag }}
    steps:
      - name: Fetch latest release asset URLs
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/latest")
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          WHEELS=$(
            echo "$RELEASE_JSON" \
            | jq -c '[.assets[] | select(.name | endswith(".whl")) | .browser_download_url] | .[0:10]'
          )
          echo "wheel_urls=$WHEELS" >> "$GITHUB_OUTPUT"

          SDISTS=$(
            echo "$RELEASE_JSON" \
            | jq -c '[.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url] | .[0:5]'
          )
          echo "sdist_urls=$SDISTS" >> "$GITHUB_OUTPUT"

          echo "Found wheels for $TAG:"
          echo "$WHEELS" | jq -r '.[]'
          echo "Found tarballs for $TAG:"
          echo "$SDISTS" | jq -r '.[]'

  # ───────────────────────────────────────────────
  # Step 2a: Linux — native runners per arch
  # ───────────────────────────────────────────────
  test-linux:
    name: "Test Linux (${{ matrix.runner_arch }})"
    needs: get-release
    if: needs.get-release.outputs.wheel_urls != '[]'
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runner_arch: x86_64
            wheel_arch: x86_64
            docker_platform: linux/amd64
          - runner: ubuntu-24.04-arm
            runner_arch: aarch64
            wheel_arch: aarch64
            docker_platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Linux ${{ matrix.runner_arch }} wheels
        env:
          WHEEL_URLS: ${{ needs.get-release.outputs.wheel_urls }}
          WHEEL_ARCH: ${{ matrix.wheel_arch }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
        run: |
          set -euo pipefail
          FAILED=0
          TESTED=0

          for URL in $(echo "$WHEEL_URLS" | jq -r '.[]'); do
            FILENAME="${URL##*/}"

            if [[ "$FILENAME" != *"linux"* ]]; then
              echo "⏭  Skipping non-Linux wheel: $FILENAME"
              continue
            fi

            IS_ARM=false; IS_X86=false
            [[ "$FILENAME" == *"aarch64"* || "$FILENAME" == *"arm64"* ]] && IS_ARM=true
            [[ "$FILENAME" == *"x86_64"*  || "$FILENAME" == *"amd64"*  ]] && IS_X86=true

            if [[ "$WHEEL_ARCH" == "aarch64" && "$IS_ARM" != "true" ]]; then
              echo "⏭  Skipping non-aarch64 wheel: $FILENAME"; continue
            fi
            if [[ "$WHEEL_ARCH" == "x86_64" && "$IS_X86" != "true" ]]; then
              echo "⏭  Skipping non-x86_64 wheel: $FILENAME"; continue
            fi

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Testing: $FILENAME"

            PY_TAG=$(echo "$FILENAME" | grep -oE 'cp3[0-9]+' | head -1)
            PY_MINOR="${PY_TAG#cp}"
            PY_VERSION="${PY_MINOR:0:1}.${PY_MINOR:1}"
            echo "Python: $PY_VERSION"

            IMG_ARCH="$( [[ "$IS_ARM" == "true" ]] && echo "aarch64" || echo "x86_64" )"

            if [[ "$FILENAME" == *"musllinux"* ]]; then
              IMAGE="python:${PY_VERSION}-alpine"
              PYBIN="python"
              INSTALL_EXTRA="apk add --no-cache curl gcc g++ musl-dev libffi-dev make linux-headers && "
            else
              GLIBC=$(echo "$FILENAME" | grep -oE 'manylinux_[0-9]+_[0-9]+' | head -1 || echo "manylinux_2_28")
              IMAGE="quay.io/pypa/${GLIBC}_${IMG_ARCH}"
              PYBIN="/opt/python/cp${PY_MINOR}-cp${PY_MINOR}/bin/python3"
              INSTALL_EXTRA=""
            fi

            echo "Image:    $IMAGE"
            echo "Platform: $DOCKER_PLATFORM"

            if ! curl -fsSL --retry 3 --retry-delay 5 -o "$FILENAME" "$URL"; then
              echo "❌ Download failed: $URL"
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "Downloaded $(du -sh "$FILENAME" | cut -f1)"

            INSTALL_CMD="${INSTALL_EXTRA}${PYBIN} -m pip install --upgrade pip --quiet \
              && ${PYBIN} -m pip install ./${FILENAME} \
              && ${PYBIN} -m pip install ${TEST_DEPS} --quiet \
              && ${PYBIN} abstract_test.py"

            if docker run --rm \
                --platform "$DOCKER_PLATFORM" \
                -v "$PWD:/workspace" -w /workspace \
                "$IMAGE" \
                sh -c "$INSTALL_CMD"; then
              echo "✅ PASSED: $FILENAME"
              TESTED=$((TESTED + 1))
            else
              echo "❌ FAILED: $FILENAME"
              FAILED=$((FAILED + 1))
            fi

            rm -f "$FILENAME"
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Linux $WHEEL_ARCH — tested: $TESTED | failed: $FAILED"
          [[ $TESTED -gt 0 ]]  || { echo "❌ No wheels were found or tested!"; exit 1; }
          [[ $FAILED -eq 0 ]]  || exit 1

  # ───────────────────────────────────────────────
  # Step 2b: macOS — native runners per arch
  # ───────────────────────────────────────────────
  test-macos:
    name: "Test macOS (${{ matrix.arch }})"
    needs: get-release
    if: needs.get-release.outputs.wheel_urls != '[]'
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel   # x86_64 (replaces retired macos-13)
            arch: x86_64
          - os: macos-latest     # arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required Python versions via Homebrew
        run: |
          set -euo pipefail
          for V in 3.10 3.11 3.12; do
            if command -v "python$V" &>/dev/null; then
              echo "python$V already available: $(python$V --version)"
            else
              echo "Installing python@$V ..."
              brew install "python@$V" || true
            fi
          done

      - name: Test macOS ${{ matrix.arch }} wheels
        env:
          WHEEL_URLS: ${{ needs.get-release.outputs.wheel_urls }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          FAILED=0
          TESTED=0

          for URL in $(echo "$WHEEL_URLS" | jq -r '.[]'); do
            FILENAME="${URL##*/}"

            # case statements are safe on macOS's bash 3.2
            case "$FILENAME" in
              *macosx*) ;;
              *)
                echo "⏭  Skipping non-macOS wheel: $FILENAME"
                continue
                ;;
            esac

            case "$FILENAME" in
              *"$ARCH"*|*universal2*) ;;   # arch matches, or universal2: test it
              *)
                echo "⏭  Skipping wrong-arch wheel ($ARCH): $FILENAME"
                continue
                ;;
            esac

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Testing: $FILENAME"

            PY_TAG=$(echo "$FILENAME" | grep -oE 'cp3[0-9]+' | head -1)
            PY_MINOR="${PY_TAG#cp}"
            PY_VERSION="${PY_MINOR:0:1}.${PY_MINOR:1}"
            PYBIN="python$PY_VERSION"
            echo "Python: $PY_VERSION"

            if ! command -v "$PYBIN" &>/dev/null; then
              echo "❌ $PYBIN not found on this runner"
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "Using: $PYBIN ($($PYBIN --version))"

            if ! curl -fsSL --retry 3 --retry-delay 5 -o "$FILENAME" "$URL"; then
              echo "❌ Download failed: $URL"
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "Downloaded $(du -sh "$FILENAME" | cut -f1)"

            # Fresh venv per wheel (Homebrew Python is PEP 668 "externally managed")
            VENV=".venv-$PY_MINOR"
            rm -rf "$VENV"
            "$PYBIN" -m venv "$VENV"
            VPY="$VENV/bin/python"

            "$VPY" -m pip install --upgrade pip --quiet
            "$VPY" -m pip install "./$FILENAME"
            "$VPY" -m pip install $TEST_DEPS --quiet

            if "$VPY" abstract_test.py; then
              echo "✅ PASSED: $FILENAME"
              TESTED=$((TESTED + 1))
            else
              echo "❌ FAILED: $FILENAME"
              FAILED=$((FAILED + 1))
            fi

            rm -rf "$FILENAME" "$VENV"
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "macOS $ARCH — tested: $TESTED | failed: $FAILED"
          [[ $TESTED -gt 0 ]]  || { echo "❌ No wheels were found or tested!"; exit 1; }
          [[ $FAILED -eq 0 ]]  || exit 1

  # ───────────────────────────────────────────────
  # Step 2c: Source tarball (sdist) — skips wheels
  # ───────────────────────────────────────────────
  test-sdist:
    name: "Test sdist (py${{ matrix.python }})"
    needs: get-release
    if: needs.get-release.outputs.sdist_urls != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test source tarballs
        env:
          SDIST_URLS: ${{ needs.get-release.outputs.sdist_urls }}
        run: |
          set -euo pipefail
          FAILED=0
          TESTED=0

          for URL in $(echo "$SDIST_URLS" | jq -r '.[]'); do
            FILENAME="${URL##*/}"

            # Only tarballs — never wheels
            if [[ "$FILENAME" == *.whl ]]; then
              echo "⏭  Skipping wheel: $FILENAME"; continue
            fi
            if [[ "$FILENAME" != *.tar.gz ]]; then
              echo "⏭  Skipping non-tarball: $FILENAME"; continue
            fi

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Testing sdist: $FILENAME (Python ${{ matrix.python }})"

            if ! curl -fsSL --retry 3 --retry-delay 5 -o "$FILENAME" "$URL"; then
              echo "❌ Download failed: $URL"
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "Downloaded $(du -sh "$FILENAME" | cut -f1)"

            rm -rf .venv-sdist
            python -m venv .venv-sdist
            VPY=".venv-sdist/bin/python"

            "$VPY" -m pip install --upgrade pip --quiet

            # Installing a local .tar.gz always builds the package from source
            if "$VPY" -m pip install "./$FILENAME" \
                && "$VPY" -m pip install $TEST_DEPS --quiet \
                && "$VPY" abstract_test.py; then
              echo "✅ PASSED: $FILENAME"
              TESTED=$((TESTED + 1))
            else
              echo "❌ FAILED: $FILENAME"
              FAILED=$((FAILED + 1))
            fi

            rm -rf "$FILENAME" .venv-sdist
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "sdist py${{ matrix.python }} — tested: $TESTED | failed: $FAILED"
          [[ $TESTED -gt 0 ]]  || { echo "❌ No tarballs were found or tested!"; exit 1; }
          [[ $FAILED -eq 0 ]]  || exit 1

  # ───────────────────────────────────────────────
  # Gate — requires Linux, macOS and sdist to pass
  # ───────────────────────────────────────────────
  all-passed:
    name: All wheel tests passed
    needs: [test-linux, test-macos, test-sdist]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          LINUX="${{ needs.test-linux.result }}"
          MACOS="${{ needs.test-macos.result }}"
          SDIST="${{ needs.test-sdist.result }}"
          echo "Linux jobs : $LINUX"
          echo "macOS jobs : $MACOS"
          echo "sdist jobs : $SDIST"

          if [[ "$LINUX" != "success" || "$MACOS" != "success" ]]; then
            echo "❌ One or more wheel tests FAILED."
            exit 1
          fi
          # sdist may be legitimately skipped if the release has no tarball
          if [[ "$SDIST" != "success" && "$SDIST" != "skipped" ]]; then
            echo "❌ Tarball tests FAILED."
            exit 1
          fi
          echo "✅ All tests passed."
